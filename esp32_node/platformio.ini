; ==============================================================================
; PlatformIO Project Configuration: ESP32 MARL Spectrum Node
; ==============================================================================
; Framework: Arduino
; Board: ESP32 Dev Module (WROOM-32 / ESP32 DevKit V1)
;
; USAGE:
;   - Build default node:
;       pio run
;   - Upload to specific node (e.g. Node 1 on COM3):
;       pio run -e node1 --target upload --upload-port COM3
;   - Monitor serial output:
;       pio device monitor -b 115200
; ==============================================================================

[platformio]
default_envs = node1

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3

; --- NODE 1 CONFIGURATION ---
[env:node1]
build_flags = 
    -D NODE_ID=1

; --- NODE 2 CONFIGURATION ---
[env:node2]
build_flags = 
    -D NODE_ID=2

; --- NODE 3 CONFIGURATION ---
[env:node3]
build_flags = 
    -D NODE_ID=3

; --- NODE 4 CONFIGURATION ---
[env:node4]
build_flags = 
    -D NODE_ID=4

; --- NODE 5 CONFIGURATION ---
[env:node5]
build_flags = 
    -D NODE_ID=5
